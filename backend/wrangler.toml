name = "jacobjbeal"
main = "src/index.ts"
compatibility_date = "2026-11-01"

workers_dev = true
preview_urls = true

[observability]
enabled = true

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

