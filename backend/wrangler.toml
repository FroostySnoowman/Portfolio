[vars]
CONTACT_TO = "jacob.j.beal@icloud.com"
# CONTACT_FROM = "site@jacobjbeal.com"

[[d1_databases]]
binding = "DB"
database_name = "jacobjbeal-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

